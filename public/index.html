<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Shop Finder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <h1>☕ Coffee Shop Finder</h1>
    <div id="authArea" class="auth-area">
      <!-- Filled by app.js: shows Login/Register or user info -->
    </div>
  </header>

  <div id="demoBanner" class="demo-banner hidden">
    You're in demo mode — showing limited results.
    <a href="#" id="upgradeLink">Upgrade for full access</a>
  </div>

  <main class="layout">

    <aside class="filters">
      <h2>Filters</h2>

      <label>
        Min Wi-Fi rating
        <select id="filterWifi">
          <option value="">Any</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
          <option value="4">4+</option>
          <option value="5">5</option>
        </select>
      </label>

      <label>
        Min outlet rating
        <select id="filterOutlets">
          <option value="">Any</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
          <option value="4">4+</option>
          <option value="5">5</option>
        </select>
      </label>

      <label>
        Noise level
        <select id="filterNoise">
          <option value="">Any</option>
          <option value="quiet">Quiet</option>
          <option value="moderate">Moderate</option>
          <option value="loud">Loud</option>
        </select>
      </label>

      <label>
        Min seating rating
        <select id="filterSeating">
          <option value="">Any</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
          <option value="4">4+</option>
          <option value="5">5</option>
        </select>
      </label>

      <button id="applyFilters">Apply Filters</button>
      <button id="clearFilters" class="secondary">Clear</button>
    </aside>

    <section class="content">

      <div id="cafeList" class="cafe-list">
        <!-- Cafe cards injected by app.js -->
      </div>

    </section>

  </main>

  <!-- Cafe detail modal -->
  <div id="cafeModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close-btn">&times;</button>
      <div id="modalBody">
        <!-- Cafe details + reviews injected by app.js -->
      </div>
    </div>
  </div>

  <!-- Auth modal (login/register) -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeAuthModal" class="close-btn">&times;</button>
      <div class="auth-tabs">
        <button id="tabLogin" class="tab active">Login</button>
        <button id="tabRegister" class="tab">Register</button>
      </div>

      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit">Login</button>
        <p class="form-error" id="loginError"></p>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <input type="text" id="registerName" placeholder="Name" required />
        <input type="email" id="registerEmail" placeholder="Email" required />
        <input type="password" id="registerPassword" placeholder="Password (min 6 chars)" required />
        <button type="submit">Create Account</button>
        <p class="form-error" id="registerError"></p>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
